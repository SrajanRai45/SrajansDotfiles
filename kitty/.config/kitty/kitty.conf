# ~/.config/kitty/kitty.conf
# Equivalent of your Ghostty config. Each section shows the Ghostty original for comparison.

# --- Shell Integration ---
# ghostty: command = /usr/bin/fish
shell /usr/bin/fish
# Kitty's shell integration (prompt marks, jump-to-prompt, etc.) is on by default
# and supports fish. Ghostty's equivalent is automatic.
shell_integration enabled

# --- Transparency & Appearance ---
# ghostty: background-opacity = 0.85
background_opacity 0.85

# ghostty: background-blur-radius = 20
# NOTE: kitty's blur only works on macOS and KDE Plasma (KWin).
# On Hyprland/Sway/niri etc. this does nothing; use your compositor's blur rules instead.
background_blur 20

# --- Typography ---
# ghostty: font-family = "JetBrainsMono Nerd Font"
font_family JetBrainsMono Nerd Font
# ghostty: font-size = 12
font_size 12.0

# --- Window Management ---
# ghostty: window-decoration = false
hide_window_decorations yes

# ghostty: window-padding-x = 12 / window-padding-y = 12
# kitty takes "vertical horizontal" when given two values
window_padding_width 12 12

# ghostty: window-padding-balance = true
# kitty's equivalent is placement_strategy: "center" splits leftover pixels evenly
# around the cell grid (this is already kitty's default, kept here to be explicit).
placement_strategy center

# --- Colors ---
# Dynamic pywal colors (Uncomment and point to your pywal color scheme)
# Example:
# include ~/.cache/wal/colors-kitty.conf
# include /path/to/your/wal/colors-kitty.conf
