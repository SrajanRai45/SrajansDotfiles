general {
    lock_cmd = noctalia msg session lock       # Tells hypridle to use Noctalia's lock
    before_sleep_cmd = noctalia msg session lock
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 Minute lock screen
listener {
    timeout = 300                                 
    on-timeout = noctalia msg session lock      # Locks the system via Noctalia
}

# 6 Minute Lock (Session Lock)
listener {
    timeout = 360                                 
    on-timeout = hyprctl dispatch dpms off        # Turn off the screen
    on-resume = hyprctl dispatch dpms on          # Turn it back on if you move the mouse
}


